# Root context
quarkus.http.host=127.0.0.1
quarkus.http.port=8081
quarkus.http.root-path=/gum
gzl.service.k8s.id=user-management-f187100000-001
root.test.bed.url=http://localhost:${quarkus.http.port}

# Jackson configurations
quarkus.jackson.serialization-inclusion=non-null

# Swagger UI configurations
quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health
quarkus.swagger-ui.default-models-expand-depth=-1
quarkus.swagger-ui.title=GUM API
quarkus.smallrye-openapi.servers=${root.test.bed.url}${quarkus.http.root-path}

# Datasource configurations
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_GUM_USER:gazelle}
quarkus.datasource.password=${DB_GUM_PASSWORD:gazelle}
quarkus.datasource.jdbc.url=${DB_GUM_JDBC_URL:jdbc:postgresql://localhost:${quarkus.datasource.devservices.port}/gum}
quarkus.datasource.jdbc.max-size=16

# Hibernate configurations
quarkus.hibernate-orm.schema-management.strategy=none

# Flyway configurations
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=gum
quarkus.flyway.clean-at-start=true

# Mail configurations
quarkus.mailer.from=no-reply@${SMTP_FROM_DOMAIN:example.com}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:test}
quarkus.mailer.password=${SMTP_PASSWORD:test}
quarkus.mailer.mock=${SMTP_MOCK_ENABLED:true}

# Dev services
quarkus.devservices.enabled=true
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.port=5433
quarkus.datasource.devservices.db-name=gum
quarkus.datasource.devservices.image-name=postgres:14
quarkus.datasource.devservices.username=gazelle
quarkus.datasource.devservices.password=gazelle

# broker config (production)
mqtt.host=${MQTT_HOST:localhost}
mqtt.port=${MQTT_PORT:1883}
mqtt.username=${MQTT_USERNAME:gazelle}
mqtt.password=${MQTT_PASSWORD:gazelle}
mqtt.reconnect-interval-seconds=3

# MQTT configurations
mp.messaging.outgoing.organization-management-out.connector=smallrye-mqtt
mp.messaging.outgoing.organization-management-out.topic=organization-management
mp.messaging.outgoing.organization-management-out.qos=1
mp.messaging.outgoing.organization-management-out.auto-clean-session=false
mp.messaging.outgoing.organization-management-out.host=${mqtt.host}
mp.messaging.outgoing.organization-management-out.port=${mqtt.port}
mp.messaging.outgoing.organization-management-out.username=${mqtt.username}
mp.messaging.outgoing.organization-management-out.password=${mqtt.password}
mp.messaging.outgoing.organization-management-out.client-id=${gzl.service.k8s.id}-organization-management-out
mp.messaging.outgoing.organization-management-out.reconnect-interval-seconds=${mqtt.reconnect-interval-seconds}

# Required to resolve implementations for CDI
quarkus.index-dependency.core.group-id=net.ihe.gazelle
quarkus.index-dependency.core.artifact-id=user-management-core
quarkus.index-dependency.commons.group-id=net.ihe.gazelle
quarkus.index-dependency.commons.artifact-id=user-management-commons
quarkus.index-dependency.security.group-id=net.ihe.gazelle
quarkus.index-dependency.security.artifact-id=security

# GZL properties
gzl.m2m.registration.startup.enabled=${GZL_M2M_REGISTRATION_STARTUP_ENABLED:false}
gzl.organization.creation.enabled=${GZL_ORGANIZATION_CREATION_ENABLED:true}
gzl.root.test.bed.url=${ROOT_TEST_BED_URL:http://localhost}
gzl.jwt.verify.audience=${GZL_JWT_VERIFY_AUDIENCE:http://localhost}
gzl.service.name=gazelle-user-management
gzl.service.version=${quarkus.application.version}
gzl.sso.realm.name=${GZL_SSO_REALM:gazelle}
gzl.sso.url=${GZL_SSO_URL:http://localhost:28080/auth}
gzl.terms.of.service.url=${GZL_TERMS_OF_SERVICE_URL:https://www.ihe-europe.net/privacy-policy}
gzl.privacy.policy.url=${GZL_PRIVACY_POLICY_URL:https://www.ihe-europe.net/privacy-policy}
gzl.tm.jdbc.password=${DB_TM_PASSWORD:gazelle}
gzl.tm.jdbc.url=${DB_TM_JDBC_URL:jdbc:postgresql://localhost:${quarkus.datasource.devservices.port}/gazelle}
gzl.tm.jdbc.username=${DB_TM_USER:gazelle}
gzl.tm.url=${GZL_TM_URL:http://localhost:8080}
gzl.user.management.front.url=${GZL_USER_MANAGEMENT_FRONT_URL}
gzl.user.inactivated.purge.after.days=${GZL_USER_INACTIVATED_PURGE_AFTER_DAYS:31}
gzl.user.registration.enabled=${GZL_USER_REGISTRATION_ENABLED}
gzl.user.creation.email.notification.enabled=${GZL_USER_CREATION_EMAIL_NOTIFICATION_ENABLED:true}
