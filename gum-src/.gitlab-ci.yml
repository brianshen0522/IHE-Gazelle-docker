# Define templates
include:
  - project: "${GITLAB_CI_TEMPLATES_PATH}"
    file: "${GITLAB_CI_TEMPLATES_FILE}"
    ref: "master"

# Define stages
stages:
  - prepare
  - build
  - test
  - publish
  - security
  - release
  - upgrade
  - clean
  - schedule
  - scheduled-jobs

# Define global variables
variables:
  P_NAME: "gazelle-user-management"
  P_APP_TYPE: "java"
  P_CODE_SRC_PATH: "."
  P_MAVEN_IMAGE_TAG: "3.9.15-jdk-25-slim"
  SERVICE_PATH: "gazelle-keycloak/keycloak-provider"

# Define jobs
compile/unit-test:
  stage: build
  extends:
    - .buildJavaMavenTest
  variables:
    P_MAVEN_EXTRA_ARGS: "-Dquarkus.test.profile.tags=unit-test"

package:
  stage: build
  extends:
    - .buildJavaMavenPackageWithDocker
  needs:
    - job: compile/unit-test
      artifacts: true

integration-tests:
  stage: test
  extends:
    - .testJavaMavenIntegrationTestsWithDocker
  variables:
    P_MAVEN_EXTRA_ARGS: "-DskipUTs -Dit.base.uri=http://docker -Ddb.ext.host=docker"
    GZL_TM_JDBC_URL: "jdbc:postgresql://docker:5433/gazelle"
    QUARKUS_DATASOURCE_JDBC_URL: "jdbc:postgresql://docker:5433/gum"
  needs:
    - job: compile/unit-test
      artifacts: true
    - job: package
      artifacts: true

static-analysis:
  stage: test
  extends:
    - .testJavaMavenSonarAnalysis
  needs:
    - job: compile/unit-test
      artifacts: true

install-cache-repo:
  stage: publish
  extends:
    - .publishJavaMavenInstall
  needs:
    - job: compile/unit-test
      artifacts: true
    - job: package
      artifacts: true
    - job: integration-tests
      artifacts: false

publish-artifacts:
  stage: publish
  extends:
    - .publishJavaMavenArtifact
  needs:
    - job: compile/unit-test
      artifacts: true
    - job: package
      artifacts: true
    - job: integration-tests
      artifacts: false

release/code:
  stage: release
  extends:
    - .releaseCodeForQuarkus
  when: manual
  variables:
    P_MAVEN_JAVADOC_SKIP: "true"

# Release gum-keycloak docker image
release/docker/keycloak:
  stage: release
  extends:
    - .releaseDockerImageWithMaven
  needs: [ "release/code" ]

# Release gum-quarkus docker image
release/docker/quarkus:
  stage: release
  extends:
    - .releaseDockerWithQuarkus
  variables:
    DOCKER_IMAGE_NAME : "gazelle-user-management-quarkus"
  needs: [ "release/code" ]

release/documentation:
  stage: release
  extends:
    - .releaseDocumentation
  variables:
    USER_DOCUMENTATION_APP_NAME: "User-Management"
    JIRA_COMPONENT_NAME: "gazelle-user-management"
  needs: [ "release/code" ]

## -- e2e tests -- ##
e2e-chrome:
  stage: test
  extends:
    - .testWithCypressForChrome
  variables:
    NPM_DIRECTORY: "./cypress"
  rules:
    - if: '$START_E2E_EXECUTION == "true"'

e2e-firefox:
  stage: test
  extends:
    - .testWithCypressForFirefox
  variables:
    NPM_DIRECTORY: "./cypress"
  needs:
    - job: e2e-chrome
      artifacts: false
  rules:
    - if: '$START_E2E_EXECUTION == "true"'

e2e-final-report:
  stage: test
  extends:
    - .testWithCypressMergeReports
  variables:
    NPM_DIRECTORY: "./cypress"
  needs:
    - job: e2e-firefox
      artifacts: true
    - job: e2e-chrome
      artifacts: true
  rules:
    - if: '$START_E2E_EXECUTION == "true"'

security/containerWithTrivy:
  extends:
    - .testSecurityContainerWithTrivy
  variables:
    DOCKER_IMAGE_NAME : "gazelle-user-management-quarkus"
  needs: [ "publish-artifacts" ]

security/SBOMForJava:
  extends:
    - .testSecuritySBOMForJava
  needs: [ "security/containerWithTrivy" ]

security/dependenciesWithOwaspDependencyCheck:
  extends:
    - .testSecurityDependenciesForJavaWithOwaspDependencyCheck
  needs: [ "security/containerWithTrivy" ]
