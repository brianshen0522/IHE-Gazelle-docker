# 固定 compose 專案名(volume/network 前綴),避免資料夾改名造成 volume 改指
name: ihe-gazelle-docker

services:
  db:
    image: postgres:17-alpine
    container_name: gazelle-tm-db
    # md5 password mode: TM's legacy JDBC driver (42.2.1.jre7 / Java 7) cannot do SCRAM
    command: ["postgres", "-c", "password_encryption=md5", "-c", "max_prepared_transactions=100"]
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_TM_NAME}
      POSTGRES_HOST_AUTH_METHOD: md5
      TZ: ${TZ}
    volumes:
      - pgdata17:/var/lib/postgresql/data
      - ./authdb/00-md5-password.sh:/docker-entrypoint-initdb.d/00-md5-password.sh:ro
      - ./authdb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${DB_PUBLISHED_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_TM_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  mqtt:
    image: eclipse-mosquitto:2
    container_name: gazelle-tm-mqtt
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: gazelle-nginx
    networks:
      default:
        aliases:
          - ${NGINX_NETWORK_ALIAS}
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_HTTP_PORT}:8888"
    restart: unless-stopped

  keycloak:
    build:
      context: ./keycloak
    image: gazelle-keycloak:26.6.4-jdk25
    container_name: gazelle-keycloak
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_HTTP_PORT: "8180"
      KC_HTTP_RELATIVE_PATH: /auth
      DB_KC_HOST: db
      DB_KC_PORT: "5432"
      DB_KC_NAME: keycloak
      DB_KC_USER: ${DB_USER}
      DB_KC_PASSWORD: ${DB_PASSWORD}
      DB_GUM_HOST: db
      DB_GUM_PORT: "5432"
      DB_GUM_NAME: gum
      DB_GUM_USER: ${DB_USER}
      DB_GUM_PASSWORD: ${DB_PASSWORD}
      APP_VERSION: "5.0.1"
      REALM: gazelle
      GZL_SSO_REALM: gazelle
      KC_HOSTNAME: "${PUBLIC_URL}/auth"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      GZL_TERMS_OF_SERVICE_URL: "${PUBLIC_URL}/tm"
      GZL_PRIVACY_POLICY_URL: "${PUBLIC_URL}/tm"
      FQDN: ${PUBLIC_HOST}
      SCHEME: ${PUBLIC_SCHEME}
      ROOT_TEST_BED_URL: "${PUBLIC_URL}"
      GZL_TM_URL: "${PUBLIC_URL}/tm"
      GZL_USER_MANAGEMENT_FRONT_URL: "${PUBLIC_URL}/gazelle/user-management"
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_SSO_ADMIN_EMAIL: "${SSO_ADMIN_EMAIL}"
      GZL_SSO_DEFAULT_LOCALE: en
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: "${SMTP_STARTTLS}"
      SMTP_SSL: "${SMTP_SSL}"
      SMTP_FROM_DOMAIN: ${SMTP_FROM_DOMAIN}
      # merged with the JVM default CAs; lets realm SMTP trust the bundled mailpit
      KC_TRUSTSTORE_PATHS: /opt/keycloak/conf/smtp-ca/ca.pem
    volumes:
      - ./mailpit/certs/ca.pem:/opt/keycloak/conf/smtp-ca/ca.pem:ro
      - ./keycloak/scripts:/opt/startup-scripts
      - ./keycloak/realm-migration:/realm-migration
      - ./keycloak/providers/keycloak-protocol-cas-26.6.3.jar:/opt/keycloak/providers/keycloak-protocol-cas.jar:ro
      - ./keycloak/providers/keycloak-theme-5.0.1.jar:/opt/keycloak/providers/keycloak-theme.jar:ro
      - ./keycloak/providers/keycloak-provider-shaded.jar:/opt/keycloak/providers/keycloak-provider-shaded.jar:ro
      - ./keycloak/quarkus.properties:/opt/keycloak/conf/quarkus.properties:ro
      - ./keycloak/keycloak-config-cli-26.5.5.jar:/opt/keycloak/keycloak-config-cli-26.5.5.jar:ro
      - ./keycloak/jq:/opt/startup-scripts/jq:ro
      - kc-app-version:/opt/app-version
    healthcheck:
      # healthy = gazelle realm exists AND the full realm migration (incl. the
      # repeatable imports that set the clients-admin password) has finished —
      # otherwise a fast-booting TM registers its clients before the password
      # applies and fails with invalid_grant
      test: ["CMD-SHELL", "test -f /tmp/realm-migration-done && curl -sf http://localhost:8180/auth/realms/gazelle/.well-known/openid-configuration -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  gum:
    build:
      context: ./gum
    image: gazelle-gum:5.0.1
    container_name: gazelle-gum
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      TZ: ${TZ}
      DB_GUM_HOST: db
      DB_GUM_PORT: "5432"
      DB_GUM_NAME: gum
      DB_GUM_USER: ${DB_USER}
      DB_GUM_PASSWORD: ${DB_PASSWORD}
      DB_TM_HOST: db
      DB_TM_PORT: "5432"
      DB_TM_NAME: ${DB_TM_NAME}
      DB_TM_USER: ${DB_USER}
      DB_TM_PASSWORD: ${DB_PASSWORD}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      FQDN: ${PUBLIC_HOST}
      SMTP_MOCK_ENABLED: "${SMTP_MOCK_ENABLED}"
      SMTP_SSL_ENABLED: "${SMTP_SSL}"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_DOMAIN: ${SMTP_FROM_DOMAIN}
      # quarkus-mailer: STARTTLS 與自簽信任(env 覆寫 application.properties)
      QUARKUS_MAILER_START_TLS: "${SMTP_STARTTLS_MODE}"
      QUARKUS_MAILER_TRUST_ALL: "${SMTP_TRUST_ALL}"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      JWT_VERIFY_PUBLIC_KEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
      JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_AUDIENCES: "${M2M_AUDIENCE}"
      ROOT_TEST_BED_URL: "${PUBLIC_URL}"
      GZL_TM_URL: "${PUBLIC_URL}/tm"
      GZL_USER_MANAGEMENT_FRONT_URL: "${PUBLIC_URL}/gazelle/user-management"
      GZL_TERMS_OF_SERVICE_URL: "${PUBLIC_URL}/tm"
      GZL_PRIVACY_POLICY_URL: "${PUBLIC_URL}/tm"
      GZL_ORGANIZATION_CREATION_ENABLED: "true"
      GZL_USER_REGISTRATION_ENABLED: "true"
      GZL_M2M_REGISTRATION_STARTUP_ENABLED: "true"
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SERVICE_K8S_ID: "user-management-gum01-001"
      GZL_M2M_CLIENT_SECRET: "${GUM_M2M_SECRET}"
    restart: unless-stopped

  # 假 SMTP server(開發/測試用):強制 STARTTLS、要求帳密,收信匣在 /mailpit/
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: gazelle-mailpit
    environment:
      TZ: ${TZ}
      MP_SMTP_AUTH: "${SMTP_USERNAME}:${SMTP_PASSWORD}"
      MP_SMTP_TLS_CERT: /certs/cert.pem
      MP_SMTP_TLS_KEY: /certs/key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_WEBROOT: /mailpit
    volumes:
      - ./mailpit/certs:/certs:ro
    restart: unless-stopped

  static-sim:
    image: nginx:alpine
    container_name: gazelle-static-sim
    volumes:
      - ./static-sim/www:/usr/share/nginx/html:ro
      - ./static-sim/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  service-registry:
    build:
      context: ./gateways/sreg
      args:
        APPDIR: quarkus-app
    image: gazelle-service-registry:2.1.0
    container_name: gazelle-service-registry
    volumes:
      - ./sreg-config/services.json:/opt/service-registry/services.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8097/service-registry/health -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_M2M_CLIENT_SECRET: "${SREG_M2M_SECRET}"
      GZL_SERVICE_K8S_ID: "service-registry-sreg01-001"
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
    restart: unless-stopped

  simulation-gateway:
    build:
      context: ./gateways/sgw
      args:
        APPDIR: quarkus-app
    image: gazelle-simulation-gateway:0.3.2
    container_name: gazelle-simulation-gateway
    depends_on:
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SERVICE_REGISTRY_ENABLED: "true"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_M2M_CLIENT_SECRET: "${SGW_M2M_SECRET}"
      GZL_SERVICE_K8S_ID: "simulation-gateway-sgw01-001"
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
      GZL_ROOT_TEST_BED_URL: "${PUBLIC_URL}"
    restart: unless-stopped

  validation-gateway:
    build:
      context: ./gateways/vgw
      args:
        APPDIR: quarkus-app
    image: gazelle-validation-gateway:1.0.2
    container_name: gazelle-validation-gateway
    depends_on:
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SERVICE_REGISTRY_ENABLED: "true"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_M2M_CLIENT_SECRET: "${VGW_M2M_SECRET}"
      GZL_SERVICE_K8S_ID: "validation-gateway-vgw01-001"
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
      DATAHOUSE_INDEXES_ENABLED: "false"
      DATAHOUSE_INDEXES_FAIL_ON_ERROR: "false"
      EVS_API_USER_NEED_TO_BE_LOGGED_IN: "false"
    restart: unless-stopped

  xml-validation-service:
    build:
      context: ./gateways/xvs
      args:
        APPDIR: quarkus-app
    image: gazelle-xml-validation-service:3.1.1
    container_name: gazelle-xml-validation
    depends_on:
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GZL_MIGRATION_ENABLED: "false"
      XML_VALIDATION_INDEX_PATH: "/opt/xml-validation-service-resources/index.json"
      GZL_SERVICE_REGISTRY_ENABLED: "true"
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SERVICE_K8S_ID: "xml-validation-service-xvs01-001"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_M2M_CLIENT_SECRET: "${XVS_M2M_SECRET}"
      GZL_SERVICE_REST_INTERFACE_BASEURL: "http://xml-validation-service:8084/xml-validation-service/rest"
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
    volumes:
      - ./xvs-resources:/opt/xml-validation-service-resources
    restart: unless-stopped

  maestro:
    build:
      context: ./gateways/maestro
      args:
        APPDIR: quarkus-app
    image: gazelle-maestro:1.2.0
    container_name: gazelle-maestro
    depends_on:
      service-registry:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      GZL_MAESTRO_URL: "http://maestro:8150/maestro"
      GZL_SERVICE_REGISTRY_ENABLED: "true"
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_SERVICE_K8S_ID: "maestro-mst01-001"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_SSO_REALM: gazelle
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GZL_M2M_CLIENT_SECRET: "${MAESTRO_M2M_SECRET}"
      GZL_JWT_VERIFY_AUDIENCE: "${M2M_AUDIENCE}"
      MP_JWT_VERIFY_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      MP_JWT_VERIFY_PUBLICKEY_LOCATION: "${PUBLIC_URL}/auth/realms/gazelle/protocol/openid-connect/certs"
      GZL_REPORT_RECORDING_ENABLED: "false"
      DATAHOUSE_INDEXES_ENABLED: "false"
      DATAHOUSE_INDEXES_FAIL_ON_ERROR: "false"
    restart: unless-stopped

  gui:
    build:
      context: ./gui-src
    image: gazelle-gui:4.0.0
    container_name: gazelle-gui
    depends_on:
      gum:
        condition: service_started
      keycloak:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PORT: "3030"
      HOSTNAME: "0.0.0.0"
      SCHEME: ${PUBLIC_SCHEME}
      FQDN: "${PUBLIC_HOSTPORT}"
      BASE_URL: "${PUBLIC_URL}/gazelle"
      KEYCLOAK_ISSUER: "${PUBLIC_URL}/auth/realms/gazelle"
      KEYCLOAK_CLIENT_ID: "OIDC_GAZELLE_CLIENT"
      NEXTAUTH_URL: "${PUBLIC_URL}/gazelle/api/auth/"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      GZL_GUM_API_URL: "http://gum:8081/gum/rest"
      GZL_TM_URL: "${PUBLIC_URL}/tm"
      GZL_REGISTRATION_URL: "${PUBLIC_URL}/gazelle/user-management/registration"
      GZL_HOME_CONFIGURATION_FOLDER: "/opt/gazelle/user-interface"
      GZL_SERVICE_REGISTRY_URL: "http://service-registry:8097/service-registry"
      GZL_VALIDATION_GATEWAY_URL: "http://validation-gateway:8092/validation-gateway/rest/v1/profiles"
      GZL_SIMULATION_GATEWAY_URL: "http://simulation-gateway:8087/simulation-gateway/rest/simulation/v1/sequences"
      GZL_MAESTRO_URL: "http://maestro:8150/maestro"
      GZL_MAESTRO_WEBSOCKET_URL: "ws://maestro:8150/maestro"
      GZL_MAESTRO_PERSIST: "false"
    volumes:
      - ./gui-home:/opt/gazelle/user-interface:ro
    restart: unless-stopped

  jboss:
    build:
      context: .
      dockerfile: jboss/Dockerfile
    image: gazelle-tm-jboss:12.1.0
    container_name: gazelle-tm-app
    platform: linux/amd64
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      TZ: ${TZ}
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_TM_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      GZL_SSO_ENABLED: "true"
      PUBLIC_URL: "${PUBLIC_URL}"
      PUBLIC_SCHEME: "${PUBLIC_SCHEME}"
      PUBLIC_HOST: "${PUBLIC_HOST}"
      PUBLIC_PORT: "${PUBLIC_PORT}"
      GZL_SSO_ADMIN_USER: ${SSO_CLIENTS_ADMIN_USER}
      GZL_SSO_ADMIN_PASSWORD: ${SSO_CLIENTS_ADMIN_PASSWORD}
      GUM_REST_API_URL: "http://gum:8081/gum"
      GUM_FRONT_URL: "${PUBLIC_URL}/gazelle/user-management"
      GZL_SSO_URL: "${PUBLIC_URL}/auth"
      GZL_M2M_CLIENT_SECRET: "${TM_M2M_SECRET}"
      GZL_M2M_IDENTITY_EMAIL: "${SSO_ADMIN_EMAIL}"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_STARTTLS: "${SMTP_STARTTLS}"
      SMTP_SSL: "${SMTP_SSL}"
      JAVA_OPTS_EXTRA: "-Xms512m -Xmx2048m -XX:MaxPermSize=768m -Djava.net.preferIPv4Stack=true -Dfile.encoding=UTF-8 -Dmqtt.broker.url=tcp://mqtt:1883"
      # ---- Flyway placeholders (initial application preferences, re-applied on every start) ----
      app_instance_oid: "1.3.6.1.4.1.12559.11.1.1"
      application_admin_email: "brianshen0522@gmail.com"
      application_admin_name: "Brian Shen"
      application_admin_title: "Administrator"
      application_email_account_for_history: "brianshen0522@gmail.com"
      application_gazelle_documentation_url: "https://gazelle.ihe.net/gazelle-documentation/"
      application_gazelle_release_notes_url: "https://gazelle.ihe.net/gazelle-documentation/Test-Management/release-note.html"
      application_issue_tracker_url: "https://gazelle.ihe.net/jira"
      application_no_reply_email: "no-reply@${SMTP_FROM_DOMAIN}"
      application_url: "${PUBLIC_URL}/tm"
      application_url_basename: "tm"
      application_zone: "dev"
      assertions_manager_rest_api: "${PUBLIC_URL}/AssertionManagerGui"
      atna_msg_specification_url: "https://gazelle.ihe.net"
      auto_update_results: "false"
      automated_step_enabled: "false"
      cas_enabled: "true"
      cat_result_check_interval: "60"
      certificates_url: "${PUBLIC_URL}/tm"
      datahouse_enabled: "false"
      default_gazelle_language: "EN"
      delete_on_gmm: "false"
      evs_client_url: "${PUBLIC_URL}/evs"
      gazelle_datahouse_ui_base_url: "${PUBLIC_URL}"
      gazelle_home_path: "/opt/gazelle"
      gazelle_master_model: "${PUBLIC_URL}/tm"
      gazelle_proxy_url: "${PUBLIC_URL}/proxy"
      gwt_url: "${PUBLIC_URL}/tm"
      ip_login: "true"
      ip_login_admin: ".*"
      is_master_model: "true"
      is_product_registry: "false"
      is_test_management: "true"
      is_tests_display_as_not_logged_in: "true"
      jira_base_url: "https://gazelle.ihe.net/jira"
      jira_report_test_issue_project: "TM"
      jira_test_issue_project: "TM"
      maestro_url: "${PUBLIC_URL}/maestro"
      partners_check_interval: "60"
      ping_enabled: "false"
      ping_time: "30"
      send_emails_to_all_admins: "false"
      svs_repository_url: "https://gazelle.ihe.net/SVSSimulator"
      test_execution_ui_url: "${PUBLIC_URL}/testexec"
      test_model_repository_url: "${PUBLIC_URL}/tm"
      time_zone: "${TZ}"
      tls_test_url: "${PUBLIC_URL}/tls"
      tls_url: "${PUBLIC_URL}/tls"
      use_assertions: "false"
      use_jira_test_issues: "false"
      use_messages: "false"
      use_messages_session_timeout: "60"
      validation_portal_url: "${PUBLIC_URL}/evs"
    volumes:
      - gazelle-opt:/opt/gazelle
      - ./mailpit/certs/ca.pem:/opt/smtp-ca/ca.pem:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/tm/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 60
      start_period: 300s
    restart: unless-stopped

volumes:
  pgdata:
  pgdata17:
  gazelle-opt:
  kc-app-version:
