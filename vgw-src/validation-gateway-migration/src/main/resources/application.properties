quarkus.application.name=validation-gateway-migration
quarkus.http.port=8091
quarkus.http.root-path=/evs-migration

# Quinoa / Next.js
quarkus.quinoa.package-manager-install.node-version=20.10.0
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.build-dir=out
quarkus.quinoa.ui-root-path=/

# EVS source PostgreSQL
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${EVS_POSTGRES_URL:jdbc:postgresql://localhost:5432/evsclient}
quarkus.datasource.username=${EVS_POSTGRES_USER:gazelle}
quarkus.datasource.password=${EVS_POSTGRES_PASSWORD:gazelle}
quarkus.datasource.jdbc.max-size=8

# Mongo target
mongodb.connection.string=${MONGODB_CONNECTION_STRING:mongodb://gazelle:gazelle@localhost:27017/}
mongodb.database=${MONGODB_DATABASE:datahouse}
migration.target.mongo.create-indexes=${MIGRATION_TARGET_MONGO_CREATE_INDEXES:true}
mongodb.connection.max-pool-size=${MONGODB_MAX_POOL_SIZE:20}
mongodb.connection.min-pool-size=${MONGODB_MIN_POOL_SIZE:0}
mongodb.connection.max-connecting=${MONGODB_MAX_CONNECTING:2}
mongodb.connection.max-wait-ms=${MONGODB_MAX_WAIT_MS:15000}
mongodb.connection.server-selection-timeout-ms=${MONGODB_SERVER_SELECTION_TIMEOUT_MS:15000}
mongodb.connection.connect-timeout-ms=${MONGODB_CONNECT_TIMEOUT_MS:10000}
mongodb.connection.read-timeout-ms=${MONGODB_READ_TIMEOUT_MS:0}
mongodb.connection.retry-writes=${MONGODB_RETRY_WRITES:false}
mongodb.connection.retry-reads=${MONGODB_RETRY_READS:true}

# Migration behavior
migration.batch.size=${MIGRATION_BATCH_SIZE:100}
migration.super-admin.username=${SUPER_ADMIN_USERNAME:gazelle-super-admin}
