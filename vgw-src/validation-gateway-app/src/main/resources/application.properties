# Application general configurations
gzl.service.name=validation-gateway
gzl.service.version=${quarkus.application.version}
gzl.service.k8s.id=${GZL_SERVICE_K8S_ID:validation-gateway-056e20000-001}

# HTTP Server Configuration
quarkus.http.port=8092
quarkus.http.auth.proactive=true
quarkus.http.root-path=/validation-gateway
gzl.service.rest.interface.baseUrl=http://localhost:${quarkus.http.port}${quarkus.http.root-path}/rest

# Service Registry Configuration
gzl.service.registry.enabled=true
gzl.service.registry.url=http://localhost:8089/service-registry

# M2M registration configurations
gzl.m2m.registration.startup.enabled=true
gzl.jwt.verify.audience=http://localhost
gzl.terms.of.service.url=http://localhost
mp.jwt.verify.publickey.location=http://localhost:8631/auth/realms/gazelle/protocol/openid-connect/certs
mp.jwt.verify.issuer=http://localhost:8631/auth/realms/gazelle
quarkus.smallrye-jwt.enabled=true

# Dependency indexing for Quarkus
quarkus.index-dependency.security.group-id=net.ihe.gazelle
quarkus.index-dependency.security.artifact-id=security

# Swagger UI configurations
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.always-run-filter=true
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.security-scheme=oauth2-implicit
quarkus.smallrye-openapi.security-scheme-name=Keycloak
quarkus.swagger-ui.oauth-client-id=OIDC_GAZELLE_CLIENT
quarkus.swagger-ui.oauth2-redirect-url=${quarkus.http.application-root-path}${quarkus.resteasy-reactive.path}/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.persist-authorization=true
quarkus.swagger-ui.path=/validation-gateway/swagger-ui
quarkus.swagger-ui.title=Validation Gateway API
quarkus.swagger-ui.theme=original

# Validation Cache Settings
gzl.validation.cache.profiles.max-size=256
gzl.validation.cache.profiles.ttl-seconds=300

# Validation profiles override index file (fixed path)
# /opt/validation-gateway/overrides-index.json
# Expected JSON shape: {"<exact.service.name>":"/opt/validation-gateway/<serviceName>/profiles.json"}
# Example:
# {
#   "CDA ModelBased Validator": "/opt/validation-gateway/cdamodelbased-profiles.json"
# }

# EVS API Configuration
evs.api.user-need-to-be-logged-in=false
evs.api.read-access-key-length=32

# Maestro Configuration
maestro.base-url=http://localhost:8150/maestro
maestro.m2m.k8s-id-variable-name=MAESTRO_M2M_K8S_ID

# Datahouse Configuration
datahouse.url=http://localhost:8086/datahouse
datahouse.m2m.k8s-id-variable-name=DATAHOUSE_M2M_K8S_ID

# Datahouse index registration startup
datahouse.indexes.enabled=true
datahouse.indexes.fail-on-error=true
datahouse.indexes.owner=validation-gateway
datahouse.indexes.version=1
datahouse.indexes.path=classpath:indexes/validation-gateway-indexes.json
datahouse.indexes.retry.max-attempts=3
datahouse.indexes.retry.initial-delay=PT1S
datahouse.indexes.retry.max-delay=PT10S

# Validation Portal redirect base URL for legacy EVS links (e.g. https://portal.example/validation-portal)
validation.portal.base-url=http://localhost:3000/gazelle/validation-portal
