# Quarkus settings
quarkus.http.port=8150
quarkus.http.root-path=/maestro
quarkus.log.level=INFO
quarkus.smallrye-health.root-path=${quarkus.http.root-path}/health

# Service definition and registration
gzl.service.name=maestro
gzl.service.version=${quarkus.application.version}
gzl.service.k8s.id=maestro-ef29700000-001
gzl.maestro.url=http://localhost:${quarkus.http.port}${quarkus.http.root-path}
gzl.service.registry.enabled=true
gzl.service.registry.url=http://localhost:8088/service-registry

# SSO configurations
gzl.m2m.registration.startup.enabled=true
gzl.m2m.client.secret=secret
gzl.sso.url=http://localhost/auth
gzl.sso.realm=gazelle
gzl.sso.admin.user=gazelle-clients-admin
gzl.sso.admin.password=gazelle
gzl.jwt.verify.audience=http://localhost
mp.jwt.verify.issuer=${gzl.sso.url}/realms/${gzl.sso.realm}
mp.jwt.verify.publickey.location=${gzl.sso.url}/realms/${gzl.sso.realm}/protocol/openid-connect/certs

# Application settings
gzl.terms.of.service.url=https://www.ihe-europe.net/privacy-policy

# Report recording
gzl.report.recording.enabled=true
datahouse.url=http://localhost/datahouse/rest/v1

# Datahouse index registration startup
datahouse.indexes.enabled=true
datahouse.indexes.fail-on-error=true
datahouse.indexes.owner=maestro
datahouse.indexes.version=1
datahouse.indexes.path=classpath:indexes/maestro-indexes.json
datahouse.indexes.retry.max-attempts=3
datahouse.indexes.retry.initial-delay=PT1S
datahouse.indexes.retry.max-delay=PT10S

# ITB configurations
itb.api.url=http://test.fr
itb.api.key=1234567890abcdef

# OpenAPI configuration
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.info-title=Maestro APIs
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.always-run-filter=true
quarkus.smallrye-openapi.path=${quarkus.http.root-path}/openapi
quarkus.smallrye-openapi.servers=${gzl.maestro.url}
quarkus.smallrye-openapi.security-scheme=oauth2-implicit
quarkus.smallrye-openapi.security-scheme-name=Keycloak
mp.openapi.extensions.smallrye.auto-inheritance=NONE
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=true
mp.openapi.scan.exclude.packages=net.ihe.gazelle.validation,net.ihe.gazelle.simulation

# Swagger UI configuration
quarkus.swagger-ui.enabled=true
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.default-models-expand-depth=1
quarkus.swagger-ui.path=${quarkus.http.root-path}/swagger-ui
quarkus.swagger-ui.title=Maestro APIs
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.oauth-client-id=OIDC_GAZELLE_CLIENT
quarkus.swagger-ui.oauth2-redirect-url=${quarkus.http.application-root-path}${quarkus.http.root-path}/swagger-ui/oauth2-redirect.html
quarkus.swagger-ui.persist-authorization=true

# Max WebSocket frame and message sizes
quarkus.websocket.max-frame-size=10485760
quarkus.websocket.max-message-size=104857600