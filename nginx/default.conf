# Single entry point for the whole Gazelle platform (plain http, port 8888).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# This proxy NEVER terminates TLS: no listen 443, no certs, no https redirects.
# In production an external reverse proxy (on another machine) terminates TLS and
# forwards here over plain http; all we do is honour the headers it sends, so the
# app-visible scheme/port match the public URL. See README for what that proxy
# must send. With no such proxy (dev), these fall back to our own http/:8888.
map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
# If the front proxy sets X-Forwarded-Proto but no X-Forwarded-Port, infer the
# default port for that scheme -- never leak our internal 8888 upstream port.
map $http_x_forwarded_proto $fwd_port_fallback {
    https   443;
    http    80;
    default $server_port;
}
map $http_x_forwarded_port $fwd_port {
    default $http_x_forwarded_port;
    ''      $fwd_port_fallback;
}

server {
    listen 8888 default_server;
    server_name _;

    # Emit relative Location headers on our own redirects (e.g. / -> /gazelle/home)
    # so the browser keeps whatever public scheme/host it used; an absolute
    # redirect here would leak our internal http/:8888 behind the TLS proxy.
    absolute_redirect off;

    # Keycloak (AUTH_SESSION_ID/KEYCLOAK_*) + NextAuth (chunked session-token)
    # cookies on one domain easily exceed the default 8k Cookie header line ->
    # "400 Request Header Or Cookie Too Large" on /auth/* login-actions pages.
    large_client_header_buffers 8 32k;

    # Docker embedded DNS, resolved per-request so nginx starts even if
    # upstreams are not up yet
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 100m;
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $fwd_proto;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $fwd_port;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 300s;

    # NextAuth sets large session cookies; default buffers are too small
    proxy_buffer_size          32k;
    proxy_buffers              8 32k;
    proxy_busy_buffers_size    64k;

    location = / { return 302 /gazelle/home; }

    # RichFaces 4.3.5 ships no packed CSS for the "plain" skin (upstream packaging
    # gap; official Gazelle instances 404 here too). Serve the skin-independent
    # packed.css content directly so home.seam stops 404ing. Regex also matches
    # the ";jsessionid=..." path-parameter variant.
    location ~ ^/tm/org\.richfaces\.resources/javax\.faces\.resource/org\.richfaces\.staticResource/4\.3\.5\.Final/PackedCompressed/plain/packed/packed\.css {
        default_type text/css;
        add_header Cache-Control "public, max-age=86400";
        return 200 "input.rf-plhdr,textarea.rf-plhdr{color:#777;}";
    }

    # Gazelle Test Management (JBoss) + its welcome-root logo
    location /tm               { set $u http://jboss:8080;                  proxy_pass $u; }
    location = /GAZELLE_LOGO.gif { set $u http://jboss:8080;                proxy_pass $u; }

    # Gazelle UI (Next.js, basePath /gazelle)
    location /gazelle          { set $u http://gui:3030;                    proxy_pass $u; }

    # Keycloak (KC_HTTP_RELATIVE_PATH=/auth)
    location /auth             { set $u http://keycloak:8180;               proxy_pass $u; }

    # Quarkus services
    location /gum                    { set $u http://gum:8081;              proxy_pass $u; }
    location /validation-gateway     { set $u http://validation-gateway:8092;  proxy_pass $u; }
    location /simulation-gateway     { set $u http://simulation-gateway:8087;  proxy_pass $u; }
    location /service-registry       { set $u http://service-registry:8097;    proxy_pass $u; }
    location /maestro                { set $u http://maestro:8150;             proxy_pass $u; }
    location /xml-validation-service { set $u http://xml-validation-service:8084; proxy_pass $u; }

    # Static simulator sequences
    location /static-simulator/ { set $u http://static-sim:80;              proxy_pass $u; }

    # Mailpit (dev fake SMTP) web UI
    location /mailpit           { set $u http://mailpit:8025;               proxy_pass $u; }
}
