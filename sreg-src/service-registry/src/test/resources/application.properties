#Tests
quarkus.http.test-port=0
quarkus.log.level=INFO

gzl.m2m.registration.startup.enabled=false
gzl.service.registry.enabled=true
gzl.service.registry.url=http://localhost:${quarkus.http.port}${quarkus.http.root-path}

# SSO Configuration (with defaults for testing)
gzl.service.registry.file.path=/opt/service-registry/nofile.json
gzl.jwt.verify.audience=http://localhost
gzl.sso.url=http://localhost:12345
gzl.sso.admin.user=admin
gzl.sso.admin.password=password
gzl.m2m.client.secret=secret
gzl.service.name=test

# JWT Configuration for tests
mp.jwt.verify.publickey.location=http://localhost:12345/public.pem
mp.jwt.verify.issuer=https://localhost:12345