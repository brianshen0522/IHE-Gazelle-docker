quarkus.application.name=service-registry
quarkus.http.root-path=/service-registry
quarkus.http.port=8097
quarkus.log.level=INFO

gzl.service.registry.url=http://localhost:${quarkus.http.port}${quarkus.http.root-path}
gzl.jwt.verify.audience=http://localhost

# Healthcheck
gzl.healthcheck.path=/health
quarkus.smallrye-health.root-path=${quarkus.http.root-path}${gzl.healthcheck.path}

# OpenAPI configuration
quarkus.smallrye-openapi.info-title=Service Registry APIs
quarkus.smallrye-openapi.path=${quarkus.http.root-path}/openapi
quarkus.smallrye-openapi.servers=${gzl.service.registry.url}
mp.openapi.extensions.smallrye.auto-inheritance=NONE
mp.openapi.extensions.smallrye.remove-unused-schemas.enable=false

# Swagger UI configuration
gazelle.swagger-ui.enabled=true

# SSO Configuration (with defaults for testing)
gzl.sso.url=http://localhost:28080
gzl.sso.realm=gazelle
gzl.sso.admin.user=gazelle-clients-admin
gzl.sso.admin.password=gazelle
gzl.m2m.client.secret=secret
mp.jwt.verify.issuer=${gzl.sso.url}/realms/${gzl.sso.realm}
mp.jwt.verify.publickey.location=${gzl.sso.url}/realms/${gzl.sso.realm}/protocol/openid-connect/certs
