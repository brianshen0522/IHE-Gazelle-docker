# CAS/SSO client configuration for Gazelle TM (Keycloak behind nginx).
# One hostname for browser and containers: gazelle.localhost -> nginx.
service=http://gazelle.localhost:8888/tm
casServerUrlPrefix=http://gazelle.localhost:8888/auth/realms/gazelle/protocol/cas
casServerLoginUrl=http://gazelle.localhost:8888/auth/realms/gazelle/protocol/cas/login
casLogoutUrl=http://gazelle.localhost:8888/auth/realms/gazelle/protocol/cas/logout
